services:
  be_bay_bot:
    build: .
    container_name: be_bay_bot
    restart: unless-stopped
    environment:
      - PHOENIX_COLLECTOR_ENDPOINT=http://host.docker.internal:4317
      - PHOENIX_PROJECT_NAME=Be_Bay_Bot
      # LM Studio endpoint - dùng host.docker.internal để kết nối từ Docker
      - TOOL_LLM_ENDPOINT=http://host.docker.internal:1234/v1
      - TOOL_LLM_MODEL=qwen3-coder-30b-a3b-instruct
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./src/data:/app/src/data
      - /home/flowerf/Projects/Arize_Phoenix_tool_kit:/app/Arize_Phoenix_tool_kit
      # THÊM DÒNG NÀY: Ánh xạ thư mục cache của Hugging Face
      - hf_cache:/root/.cache/huggingface

# THÊM KHỐI NÀY Ở CUỐI FILE: Khai báo volume do Docker quản lý
volumes:
  hf_cache:
