services:
  march7:
    image: march7-agent:latest
    build:
      context: ../../
      dockerfile: docker/march7/Dockerfile
      additional_contexts:
        base: service:base
    container_name: march7
    restart: unless-stopped
    networks:
      - march7_net
    expose:
      - "8000"
    command: ["python", "-m", "gateway"]
    depends_on:
      redis:
        condition: service_healthy
      codebox:
        condition: service_started
    env_file:
      - ../../.env
    environment:
      # March7-owned runtime
      - TZ=Asia/Ho_Chi_Minh
      - AGENT_NAME=march7
      - MARCH7_A2A_PORT=8000
      - MARCH7_REDIS_DB=0
      - MARCH7_PERSONA_PATH=twin/march7/personas

      # Gateway-owned routing
      - GATEWAY_ENABLED_PLATFORMS=discord
      - DISCORD_GATEWAY_ENABLED=true

      # Shared infrastructure
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379
      - REDIS_DB=0
      - TIMELINE_REDIS_DB=0
      - CODEBOX_API_URL=http://codebox:8069

      # Native System Gateway (runs on the host; HMAC shared secret from .env)
      - SYSTEM_GATEWAY_URL=http://host.docker.internal:8380

      # Peer agent endpoint
      - EVERNIGHT_A2A_URL=http://evernight:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../twin:/app/twin:z
      - ../../gateway:/app/gateway:z
      - ../../memories:/app/memories:z
      - ../../data:/app/data:z
      - ../../.env:/app/.env:z
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/.well-known/agent.json || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
