# The native System Gateway (services/system_gateway/) is the host boundary and
# is installed outside Docker via systemd/launchd/Windows service packaging.

networks:
  march7_net:
    driver: bridge

include:
  - shared/docker-compose.base.yml
  - shared/docker-compose.redis.yml
  - shared/docker-compose.codebox.yml
  - march7/docker-compose.yml
  - evernight/docker-compose.yml
