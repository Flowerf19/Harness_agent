services:
  # Redis service for Active Memory (Tier 1) storage
  redis:
    image: redis:7-alpine
    container_name: be_bay_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant service for Episodic Memory (Tier 2) storage
  qdrant:
    image: qdrant/qdrant:latest
    container_name: be_bay_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - ./volumes/qdrant_data:/qdrant/storage

  be_bay_bot:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: be_bay_bot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    env_file:
      - ../.env
    environment:
      # LM Studio endpoint - dùng host.docker.internal để kết nối từ Docker
      - LM_STUDIO_API_URL=http://host.docker.internal:1234/v1
      - TOOL_LLM_ENDPOINT=http://host.docker.internal:1234/v1
      - TOOL_LLM_MODEL=qwen3-coder-30b-a3b-instruct
      # Hugging Face cache
      - HF_HOME=/root/.cache/huggingface
      # Redis configuration
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379
      # Qdrant configuration
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=episodic_memory
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ../src:/app/src:Z
      - ../memories:/app/memories:Z
      - ../config.py:/app/config.py:Z
      - ./volumes/hf_cache:/root/.cache/huggingface
      # Conda env persistence
      - ./volumes/conda_envs:/opt/conda_envs