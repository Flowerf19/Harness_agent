services:
  evernight:
    image: evernight-agent:latest
    build:
      context: ../../
      dockerfile: docker/evernight/Dockerfile
      additional_contexts:
        base: service:base
    container_name: evernight
    restart: unless-stopped
    networks:
      - march7_net
    ports:
      - "8001:8001"
    command: ["python", "-m", "twin.evernight"]
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      # Evernight-owned runtime
      - AGENT_NAME=evernight
      - EVERNIGHT_A2A_PORT=8001
      - EVERNIGHT_REDIS_DB=1
      - EVERNIGHT_PERSONA_PATH=twin/evernight/personas

      # March7 coordination boundary
      - MARCH7_URL=http://march7:8000
      - MARCH7_REDIS_DB=0

      # Shared infrastructure
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379
      - REDIS_DB=1
      - TIMELINE_REDIS_DB=0
      - BASH_EXECUTOR_URL=http://bash-executor:8374
      - BASH_EXECUTOR_TIMEOUT=30

      # Native System Gateway (runs on the host; HMAC shared secret from .env)
      - SYSTEM_GATEWAY_URL=http://host.docker.internal:8380
      - SYSTEM_GATEWAY_SHARED_SECRET=${SYSTEM_GATEWAY_SHARED_SECRET}

      # Evernight background jobs
      - SELF_HEAL_ENABLED=true
      - SELF_HEAL_INTERVAL=30
      - SELF_HEAL_TIMEOUT=10
      - INACTIVITY_SECONDS=1800
      - POLL_INTERVAL=60
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../twin:/app/twin:z
      - ../../gateway:/app/gateway:z
      - ../../memories:/app/memories:z
      - ../../.env:/app/.env:z
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/.well-known/agent.json || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
