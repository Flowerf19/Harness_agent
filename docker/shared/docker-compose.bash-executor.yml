# =============================================================================
# LEGACY / DEPRECATED — Linux-only bash-executor for back-compat demos.
#
# The native System Gateway (services/system_gateway/) is the long-term host
# boundary. This compose file stays runnable until the native gateway reaches
# feature parity on the host. After that, retire this service and remove the
# file. See scripts/README.md for the deprecation plan.
# =============================================================================

services:
  bash-executor:
    build:
      context: ../../
      dockerfile: docker/shared/Dockerfile.bash-executor
    image: march7-bash-executor:latest
    container_name: march7-bash-executor
    restart: unless-stopped
    pid: "host"
    privileged: true
    user: root
    networks:
      - march7_net
    env_file:
      - ../../.env.bash_executor
    environment:
      - BASH_EXECUTOR_HOST=0.0.0.0
      - BASH_EXECUTOR_PORT=8374
    command: python /app/scripts/bash_executor_standalone.py
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8374/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
