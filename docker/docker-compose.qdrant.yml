services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: march7_qdrant
    restart: unless-stopped
    networks:
      - march7_net
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/localhost/6333) 2>/dev/null || exit 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  qdrant_data:
    driver: local

networks:
  march7_net:
    external: true
    name: docker_march7_net
