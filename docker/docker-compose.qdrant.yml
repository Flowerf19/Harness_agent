services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: march7_qdrant
    restart: unless-stopped
    networks:
      - march7_net
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./volumes/qdrant_data:/qdrant/storage:Z
    healthcheck:
      # Đảm bảo Qdrant API thực sự sẵn sàng
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
