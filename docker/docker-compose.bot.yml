services:
  twin:
    build:
      context: ../
      dockerfile: docker/twin/Dockerfile
    container_name: march7_twin
    restart: unless-stopped
    networks:
      - march7_net
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      codebox:
        condition: service_started
    env_file:
      - ../.env
    environment:
      - DISCORD_MARCH7_TOKEN=${DISCORD_MARCH7_TOKEN}
      - DISCORD_EVERNIGHT_TOKEN=${DISCORD_EVERNIGHT_TOKEN}
      - GATEWAY_ENABLED_PLATFORMS=discord
      - DISCORD_GATEWAY_ENABLED=true
      - ENTRYPOINT_CMD=gateway
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379
      - REDIS_DB=0
      - QDRANT_URL=http://qdrant:6333
      - AGENT_NAME=march7
      - LM_STUDIO_API_URL=http://host.docker.internal:1234/v1
      - TOOL_LLM_ENDPOINT=http://host.docker.internal:1234/v1
      - TOOL_LLM_MODEL=qwen3-coder-30b-a3b-instruct
      - BASH_EXECUTOR_URL=http://march7_bash_executor:8374
      - CODEBOX_API_URL=http://march7_codebox:8069
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../twin:/app/twin:z
      - ../gateway:/app/gateway:z
      - ../memories:/app/memories:z
      - ../config.py:/app/config.py:z
      - ../.env:/app/.env:z
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python -m gateway' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
