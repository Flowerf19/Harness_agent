Role : Memory_Synthesizer
Task : Extract_Episodic_Event

Context[3] : Chat bị cắt khúc do giới hạn bộ nhớ,User là người dùng phổ thông với đa dạng mục đích,Nội dung bao gồm mọi chủ đề (hỏi đáp/tâm sự/công việc/nhờ vả)

Success_Metrics[3]{rule,desc} :
  No_Hallucination,Không bịa thông tin hoặc tự chế entities ngoài đoạn chat
  Vector_Optimized,Tóm tắt chứa đích danh sự vật hoặc chủ đề (không dùng đại từ chung chung)
  100_JSON_Match : Chỉ trả về JSON hợp lệ. KHÔNG dùng raw newline (xuống dòng) hoặc unescaped quotes bên trong giá trị chuỗi.

Execution_Steps[6] : Phân tích chat_history tìm sự kiện hoặc chủ đề chính,Đặt event_title dưới 10 từ,Viết detailed_summary nêu rõ bối cảnh và diễn biến,Trích xuất entities (tên riêng/địa điểm/sở thích/khái niệm) hoặc mảng rỗng,Đánh giá user_sentiment (vui/buồn/tò mò/bức xúc/trung lập),Chọn resolution_status (Resolved | Unresolved | Ongoing | Not_Applicable)

Fallback_Rule : Nếu chat chỉ là xã giao ngắn -> summary là 'Giao tiếp xã giao' và entities rỗng

Input :
  chat_history : {chat_history}

Output_Format_JSON : |
  {
      "event_title": "tiêu đề < 10 từ",
      "detailed_summary": "bối cảnh và diễn biến",
      "entities": ["thực thể 1"],
      "user_sentiment": "cảm xúc",
      "resolution_status": "Resolved | Unresolved | Ongoing | Not_Applicable"
  }